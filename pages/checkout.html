<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<title>Checkout — Kantin Jujur</title>
<link rel="stylesheet" href="../css/variables.css">
<link rel="stylesheet" href="../css/global.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/navbar.css">
<link rel="stylesheet" href="../css/footer.css">
<link rel="stylesheet" href="../css/checkout.css">
</head>
<body data-base="../">
<header id="site-header"></header>
<main>
<div class="container"><div class="page-head" style="padding-top:32px"><h1>Checkout</h1></div><div id="checkout-wrap" class="co-layout">
 <form id="checkout-form" class="card co-card" novalidate>
  <h3>Informasi pemesan</h3>
  <div class="field"><label for="name">Nama</label><input id="name" name="name" autocomplete="name" placeholder="Nama lengkap"><span class="err" id="err-name" role="alert"></span></div>
  <div class="field"><label for="contact">NIM / WhatsApp (opsional)</label><input id="contact" name="contact" placeholder="mis. 2301234567"></div>
  <h3>Model pembelian</h3>
  <label class="opt"><input type="radio" name="model" value="langsung" checked><span><strong>Pembelian langsung di kantin</strong><br><span class="muted">Ambil produk sekarang, bayar lewat QRIS.</span></span></label>
  <label class="opt"><input type="radio" name="model" value="online"><span><strong>Pesan via website, ambil di kantin</strong><br><span class="muted">Pesan dulu, ambil saat sudah sampai kampus.</span></span></label>
  <h3>Metode pembayaran</h3><div class="opt" style="cursor:default"><i data-lucide="qr-code"></i><span><strong>QRIS</strong><br><span class="muted">Satu-satunya metode. Tidak ada pengiriman, semua diambil di kantin.</span></span></div>
  <button class="btn">Lanjut pembayaran</button></form>
 <aside class="card co-card"><h3>Ringkasan pesanan</h3><div id="co-items"></div><div class="line total"><span>Total</span><span id="co-total"></span></div></aside></div></div>
</main>
<footer id="site-footer"></footer>
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script type="module" src="../js/main.js"></script>
</body></html>

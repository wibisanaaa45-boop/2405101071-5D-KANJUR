<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<title>Laporan — Admin Kantin Jujur</title>
<link rel="stylesheet" href="../../css/variables.css">
<link rel="stylesheet" href="../../css/global.css">
<link rel="stylesheet" href="../../css/components.css">
<link rel="stylesheet" href="../../css/admin.css">
<script>document.documentElement.style.visibility='hidden'</script></head>
<body data-page="reports" data-title="Laporan">
<div class="admin-app"><aside class="admin-side" id="admin-sidebar"></aside><div class="admin-scrim" id="admin-scrim"></div>
<div class="admin-main"><header class="admin-top" id="admin-topbar"></header>
<main class="admin-content">
<div class="card panel"><div class="filters"><div class="field"><label for="rp-from">Dari</label><input id="rp-from" type="date"></div><div class="field"><label for="rp-to">Sampai</label><input id="rp-to" type="date"></div>
 <div class="field"><label for="rp-model">Model pembelian</label><select id="rp-model"><option value="all">Semua</option><option value="langsung">Langsung di kantin</option><option value="online">Via website</option></select></div>
 <button class="btn outline" id="rp-csv"><i data-lucide="download"></i>Export CSV</button></div></div>
<section class="kpis"><div class="card kpi"><small>Total pendapatan (terverifikasi)</small><strong id="rp-rev">-</strong></div><div class="card kpi"><small>Jumlah transaksi</small><strong id="rp-count">-</strong></div><div class="card kpi"><small>Transaksi terverifikasi</small><strong id="rp-paid">-</strong></div></section>
<section class="dash-grid" style="display:grid;gap:20px"><div class="card panel"><h2>Grafik penjualan</h2><div style="position:relative;height:260px"><canvas id="rp-chart"></canvas></div></div>
 <div class="card panel"><h2>Produk terlaris</h2><ul id="rp-top" style="list-style:none;padding:0;display:grid;gap:10px"></ul></div></section>
<div class="card panel"><h2>Rekap transaksi</h2><div class="table-wrap"><table><thead><tr><th>Kode</th><th>Tanggal</th><th>Model</th><th>Total</th><th>Pembayaran</th></tr></thead><tbody id="rp-body"></tbody></table></div></div>
</main></div></div>
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script type="module" src="../../js/admin-auth.js"></script>
<script type="module" src="../../js/admin-reports.js"></script>
</body></html>
